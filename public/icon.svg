<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#176BFF"/>
      <stop offset="100%" stop-color="#00E5D4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#0B1A30"/>
    </linearGradient>
  </defs>
  <!-- Background with slight rounding -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow / Accent ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#dncGrad)" stroke-width="8" stroke-opacity="0.25"/>
  
  <!-- Stylized DigitalNexCare Cross & Heartbeat Loop -->
  <g transform="translate(256, 256)">
    <!-- Vertical Bar -->
    <rect x="-32" y="-120" width="64" height="240" rx="32" fill="url(#dncGrad)"/>
    <!-- Horizontal Bar -->
    <rect x="-120" y="-32" width="240" height="64" rx="32" fill="url(#dncGrad)"/>
    
    <!-- Central Node / Pulse Dot -->
    <circle cx="0" cy="0" r="28" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="14" fill="#176BFF"/>
    
    <!-- Heartbeat Pulse Accent Overlay -->
    <path d="M-80,0 L-40,0 L-20,-45 L10,50 L30,-25 L50,0 L80,0" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Subtle Badge Text -->
  <text x="256" y="440" text-anchor="middle" fill="#00E5D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="4">NEXCARE</text>
</svg>
